name: CI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      peeringdb: ${{ steps.filter.outputs.peeringdb }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            peeringdb:
              - 'netbox_peering_manager/services/peeringdb*.py'
              - 'netbox_peering_manager/tests/test_peeringdb.py'

  test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        netbox-version: ['v4.5.5', 'v4.5.8']
        python-version: ['3.12', '3.13']

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: J5brHrAXFLQSif0K
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install NetBox
        run: |
          git clone --depth 1 --branch ${{ matrix.netbox-version }} https://github.com/netbox-community/netbox.git /tmp/netbox
          pip install --upgrade pip
          pip install -r /tmp/netbox/requirements.txt

      - name: Install netbox-routing dependency
        run: pip install git+https://github.com/DanSheps/netbox-routing.git@e4d954ca

      - name: Configure NetBox
        run: |
          cp .devcontainer/configuration/configuration.py /tmp/netbox/netbox/netbox/
          cat >> /tmp/netbox/netbox/netbox/configuration.py << 'EOF_PLUGINS'

          PLUGINS.append("netbox_routing")
          PLUGINS_CONFIG["netbox_routing"] = {}
          PLUGINS.append("netbox_peering_manager")
          PLUGINS_CONFIG["netbox_peering_manager"] = {}
          EOF_PLUGINS

          cat >> /tmp/netbox/netbox/netbox/configuration.py << EOF

          DATABASE = {
              'NAME': 'netbox',
              'USER': 'netbox',
              'PASSWORD': 'J5brHrAXFLQSif0K',
              'HOST': 'localhost',
              'PORT': '5432',
          }

          REDIS = {
              'tasks': {
                  'HOST': 'localhost',
                  'PORT': 6379,
                  'PASSWORD': '',
                  'DATABASE': 0,
                  'SSL': False,
              },
              'caching': {
                  'HOST': 'localhost',
                  'PORT': 6379,
                  'PASSWORD': '',
                  'DATABASE': 1,
                  'SSL': False,
              }
          }

          API_TOKEN_PEPPERS = {
              1: 'ci-testing-pepper-not-for-production-use-1234567890',
          }
          EOF

      - name: Install plugin
        run: pip install -e .

      - name: Run linting
        run: |
          pip install ruff
          ruff check netbox_peering_manager/
          ruff format --check netbox_peering_manager/

      - name: Check for missing migrations
        env:
          PYTHONPATH: /tmp/netbox/netbox
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: netbox.configuration
          SECRET_KEY: "abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*(-_=+)"
        run: |
          cd /tmp/netbox/netbox
          python manage.py makemigrations netbox_peering_manager --check --dry-run

      - name: Apply database migrations
        env:
          PYTHONPATH: /tmp/netbox/netbox
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: netbox.configuration
          SECRET_KEY: "abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*(-_=+)"
        run: |
          cd /tmp/netbox/netbox
          python manage.py migrate --noinput

      - name: Run core tests (excluding PeeringDB)
        env:
          PYTHONPATH: /tmp/netbox/netbox
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: netbox.configuration
          SECRET_KEY: "abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*(-_=+)"
        run: |
          cd /tmp/netbox/netbox
          python manage.py test \
            netbox_peering_manager.tests.test_api \
            netbox_peering_manager.tests.test_forms \
            netbox_peering_manager.tests.test_models \
            netbox_peering_manager.tests.test_validators \
            netbox_peering_manager.tests.test_jinja2_filters \
            netbox_peering_manager.tests.test_config_renderer \
            netbox_peering_manager.tests.test_irr_client \
            netbox_peering_manager.tests.test_jobs \
            netbox_peering_manager.tests.test_views \
            --verbosity 2

      - name: Run PeeringDB tests
        if: needs.changes.outputs.peeringdb == 'true'
        env:
          PYTHONPATH: /tmp/netbox/netbox
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: netbox.configuration
          SECRET_KEY: "abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*(-_=+)"
        run: |
          cd /tmp/netbox/netbox
          python manage.py test netbox_peering_manager.tests.test_peeringdb --verbosity 2

      - name: Django system check
        env:
          PYTHONPATH: /tmp/netbox/netbox
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: netbox.configuration
          SECRET_KEY: "abcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*(-_=+)"
        run: |
          cd /tmp/netbox/netbox
          python manage.py check
