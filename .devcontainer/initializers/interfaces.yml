  description: AMS-IX Peering LAN
  enabled: true

# IX router DE-CIX - Peering LAN interface
- device: ix-rtr-decix-01
  name: xe-0/0/0
  type: 10gbase-x-sfpp
  description: DE-CIX Peering LAN
  enabled: true

# IX router LINX - Peering LAN interface
- device: ix-rtr-linx-01
  name: xe-0/0/0
  type: 10gbase-x-sfpp
  description: LINX Peering LAN
  enabled: true

# IX router Equinix Ashburn - Peering LAN interface
- device: ix-rtr-ash-01
