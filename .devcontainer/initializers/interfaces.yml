## Additional interfaces for peering manager demo
## Note: Base interfaces come from device_types.yml templates

# Core router NYC-01 - Transit interfaces (beyond device type template)
- device: core-rtr-nyc-01
  name: xe-0/0/0
  type: 10gbase-x-sfpp
  description: Transit - Cogent
  enabled: true

- device: core-rtr-nyc-01
  name: xe-0/0/1
  type: 10gbase-x-sfpp
  description: Transit - Hurricane Electric
  enabled: true

# Edge router NYC-01 - Private peering interfaces
- device: edge-rtr-nyc-01
  name: xe-0/0/0
  type: 10gbase-x-sfpp
  description: Private Peer - Cloudflare
  enabled: true

- device: edge-rtr-nyc-01
  name: xe-0/0/1
  type: 10gbase-x-sfpp
  description: Private Peer - Google
  enabled: true

- device: edge-rtr-nyc-01
  name: xe-0/0/2
  type: 10gbase-x-sfpp
  description: Private Peer - Meta (planned)
  enabled: false

# Core router AMS-01 - Transit interface
- device: core-rtr-ams-01
  name: xe-0/0/0
  type: 10gbase-x-sfpp
  description: Transit - Lumen
  enabled: true

# IX router AMS-IX - Peering LAN interface
- device: ix-rtr-amsix-01
